name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}/lib/python*/site-packages
            ${{ env.pythonLocation }}/bin
          key: deps-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            deps-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        env:
          # Dummy key so Settings.from_env() can import. Tests mock zxingcpp
          # and genai.Client — no real WhatsApp/Gemini/barcode calls are made.
          D360_API_KEY: dummy
          # Postgres for test_db.py, runtime idempotency tests, and
          # receiving persistence tests.
          DATABASE_URL: postgres://scanner:scanner@localhost:5432/scanner
        # Source-only coverage (--cov=src) with a 95% floor (AGENTS.md).
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=95

  eval:
    name: Eval (deterministic scanner-only)
    runs-on: ubuntu-latest
    # Deterministic scanner-only regression gate. No Gemini, no LangSmith,
    # no Postgres, no network. Exits non-zero on quality regression against
    # the frozen baseline (tests/eval/baseline_frozen.json). This enforces
    # the AGENTS.md rule: scanner/recovery changes must not merge unless
    # the frozen eval baseline passes.

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}/lib/python*/site-packages
            ${{ env.pythonLocation }}/bin
          key: deps-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            deps-3.12-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Eval (deterministic scanner-only)
        env:
          # Settings.from_env() requires D360_API_KEY to import, even though
          # make eval never calls WhatsApp or Gemini.
          D360_API_KEY: dummy
        run: make eval

  web-build:
    name: Web build (frontend typecheck + production build)
    runs-on: ubuntu-latest
    # Frontend gate — no network, no Gemini, no Postgres. Catches TypeScript
    # errors and Vite build failures before merge.

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build (tsc + vite)
        run: cd web && npm run build
