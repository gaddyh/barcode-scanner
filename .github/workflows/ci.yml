name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check (non-gating, ramp to gating)
        continue-on-error: true
        run: mypy

      - name: Test with coverage
        env:
          # Dummy key so Settings.from_env() can import. Tests mock zxingcpp
          # and genai.Client — no real WhatsApp/Gemini/barcode calls are made.
          D360_API_KEY: dummy
        # Coverage floor is 71 in CI because test_db.py (live Postgres integration
        # tests) is skipped when DATABASE_URL is not set. PR #3 will add a real
        # Postgres service to CI, allowing those tests to run and coverage to ramp.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=71
