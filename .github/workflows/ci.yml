name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        env:
          # Dummy key so Settings.from_env() can import. Tests mock zxingcpp
          # and genai.Client — no real WhatsApp/Gemini/barcode calls are made.
          D360_API_KEY: dummy
          # Postgres for test_db.py and runtime idempotency tests.
          DATABASE_URL: postgres://scanner:scanner@localhost:5432/scanner
        # Coverage floor raised to 95 — Postgres service in CI so DB tests
        # and runtime idempotency tests run, and focused module tests cover
        # executor, idempotency, repository, session_repository, scanner,
        # routes, and smaller observability/eval/ingest gaps.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95
