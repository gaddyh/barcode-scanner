services:
  barcode-scanner:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      MAX_UPLOAD_BYTES: 15728640
      # Required to boot (config.py raises without it) even though the scanner
      # endpoint doesn't use WhatsApp. Set to a dummy value for scanner-only
      # testing. Set the real key when WhatsApp webhooks are needed.
      D360_API_KEY: dummy
      # The lifespan creates a transcriber on boot. It's only used for WhatsApp
      # audio, never for the scanner. Dummy key lets the app start.
      OPENAI_API_KEY: dummy
      # Postgres for sessions + idempotency. The app creates its own pool
      # from DATABASE_URL on startup.
      DATABASE_URL: postgres://scanner:scanner@postgres:5432/scanner
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: scanner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
