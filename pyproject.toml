[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode-scanner-service"
version = "0.1.0"
description = "Deterministic barcode scanning API for product photos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pillow>=11.0,<13.0",
    "opencv-python-headless>=4.10,<5.0",
    "pydantic-settings>=2.7,<3.0",
    "zxing-cpp>=3.0,<4.0",
    "numpy>=1.26,<3.0",
    "google-genai>=2.16,<3.0",
    "pydantic>=2.13,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "langsmith>=0.10,<1.0",
    "openai>=1.0,<3.0",
    "python-ulid>=3.0,<5.0",
    "asyncpg>=0.30,<1.0",
    "langgraph>=1.2.9,<2.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
]

[project.scripts]
barcode-scan = "src.cli_app:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live_gemini: hits the real Gemini API (slow, charged, network)",
    "asyncio: async tests using pytest-asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing style choices preserved as machine-enforced ignores so
# `ruff check .` is genuinely green without forcing unrelated cleanup.
"src/api/routes.py" = ["B008", "B904"]
"src/ingest/scanner.py" = ["B905"]
"src/ingest/vision.py" = ["UP042"]
"src/main.py" = ["E501"]
"src/messaging/modal_transcriber.py" = ["E501"]
"src/messaging/transcribe.py" = ["UP022"]
"src/repository.py" = ["E501"]
"tests/test_session_graph.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["src"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

# Third-party libraries without stubs.
[[tool.mypy.overrides]]
module = [
    "zxingcpp.*",
    "cv2.*",
    "langsmith.*",
    "langgraph.*",
    "asyncpg.*",
    "psycopg.*",
    "google.genai.*",
]
ignore_missing_imports = true
