services:
  - type: web
    name: barcode-scanner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MAX_UPLOAD_BYTES
        value: "15728640"
      - key: ALLOWED_IMAGE_TYPES
        value: "image/jpeg,image/png,image/webp"
      - key: DATABASE_URL
        sync: false
      # Required for the scanner pipeline:
      - key: GEMINI_API_KEY
        sync: false
      # Optional — LangSmith tracing (set all 3 in Render dashboard):
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_PROJECT
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_ENDPOINT
        sync: false
